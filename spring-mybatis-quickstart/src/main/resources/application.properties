#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=com.itheima.mybatis.entity
server.port=81
# ========== 数据源配置已外置 ==========
# 三个数据源的账号/口令不入库、不进 war，统一放在服务器上：
#   /u1/tomcat/conf/snapshot/application.properties   （chmod 600）
# 由 Tomcat 的 bin/setenv.sh 注入：
#   CATALINA_OPTS="$CATALINA_OPTS -Dspring.config.additional-location=file:/u1/tomcat/conf/snapshot/"
# additional-location 优先级高于 classpath，会覆盖同名配置项。
# 模板见 deploy/application-secret.properties.example
